name: Selenium Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'selenium-project/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'selenium-project/**'

jobs:
  test:
    name: Selenium (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    defaults:
      run:
        working-directory: selenium-project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run Selenium/Cucumber tests
        run: mvn test -Dbrowser=${{ matrix.browser }} -Dheadless=true
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: selenium-project/reports/
          retention-days: 30
