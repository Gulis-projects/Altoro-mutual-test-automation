
# All non-sensitive settings live here.
# Credentials belong in .env (see .env.example) — never commit them here.

# Application
base.url=https://demo.testfire.net

# Browser settings — override with -Dbrowser=firefox, -Dbrowser=edge
# Supported values: chrome, firefox, edge, safari
browser=chrome
headless=false

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Default Altoro Mutual credentials — override via .env or -D system property.
# Copy .env.example → .env and set APP_USERNAME / APP_PASSWORD there instead.
app.username=jsmith
app.password=Demo1234

# Test environment label (informational only)
environment=staging
